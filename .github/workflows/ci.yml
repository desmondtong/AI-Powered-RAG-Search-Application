name: CI

on:
  pull_request:
  push:
    branches: [main]

# The build and the browser test never reach Supabase or Gemini: the browser
# script intercepts every request. These are placeholders, not credentials.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_SERVICE_ROLE_KEY: ci-dummy
  GEMINI_API_KEY: ci-dummy

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:experience
      - run: npm run test:jd-fit
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
