schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - For any user-facing UI change, the implementation is not complete until the agent starts the app locally, opens it in a real browser or browser automation session, and walks through the changed workflow end to end.
      - Code-level tests, static contract tests, lint, typecheck, and build are required but do not replace browser walkthrough verification.
      - The final implementation summary must include the dev server command, URL, browser walkthrough steps performed, observed result, and any screenshots or limitations.
      - If browser automation is unavailable, mark the browser walkthrough as blocked and explain why; do not silently substitute unit tests.
